location ~ ^/clipshot/v[0-9]+\.[0-9]+\.[0-9]+/ClipShot-(Win10-|Win11-)?Setup-[0-9]+\.[0-9]+\.[0-9]+\.exe$ {
    proxy_set_header Host bot.data-clouds.ru;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_ssl_server_name on;
    proxy_ssl_name bot.data-clouds.ru;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header X-ClipShot-Path de-relay always;
    proxy_pass https://bot.data-clouds.ru;
    slice 1m;
    proxy_set_header Range $slice_range;
    proxy_set_header If-Range "";
    proxy_cache clipshot_updates;
    proxy_cache_key "clipshot:$uri:$slice_range";
    proxy_cache_valid 200 206 365d;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_lock_age 30s;
    proxy_force_ranges on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    add_header X-ClipShot-Cache $upstream_cache_status always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
