# ClipShot: RF is the sole origin. Mutable metadata is never cached.
location = /clipshot/update-feed.json {
    proxy_set_header Host bot.data-clouds.ru;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_ssl_server_name on;
    proxy_ssl_name bot.data-clouds.ru;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header X-ClipShot-Path de-relay always;
    proxy_pass https://bot.data-clouds.ru;
    proxy_cache off;
    proxy_no_cache 1;
    add_header Cache-Control "no-store" always;
}
location = /clipshot/latest.json {
    proxy_set_header Host bot.data-clouds.ru;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
